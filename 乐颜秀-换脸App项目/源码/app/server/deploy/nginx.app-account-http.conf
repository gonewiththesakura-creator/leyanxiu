# HTTP only serves public ACME challenge files. App/account traffic requires TLS.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 404;
}
server {
    listen 80;
    server_name REDACTED_COMPANY_INFRASTRUCTURE;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/leyanxiu-acme;
        default_type text/plain;
    }
    location / { return 404; }
}

# TEMPORARY: debug APK connectivity only. Never use for real face images,
# credentials, payment, or public production. Replace with HTTPS immediately.
limit_req_zone $binary_remote_addr zone=leyanxiu_staging_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=leyanxiu_staging_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 20m;
    limit_conn leyanxiu_staging_conn 10;
    add_header X-Leyanxiu-Environment "staging-cleartext" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/downloads/(?<apk>[A-Za-z0-9][A-Za-z0-9._-]*\.apk)$ {
        alias /var/www/leyanxiu-downloads/$apk;
        limit_except GET HEAD { deny all; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=\"$apk\"" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        limit_req zone=leyanxiu_staging_api burst=15 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/readiness {
        deny all;
    }
}
